<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YogurtLib</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/style.css">
    <style>
        :root {
            --accent: #8c52ff;
            --bg-dark: #000000;
            --panel-bg: #111111;
            --border: #333;
            --text: #ffffff;
            --field-size: 550px;
            --warning-gold: #ffcc00;
        }

        body { 
            font-family: 'Open Sans', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }
      
        .site-header, .site-footer { align-self: stretch; width: 100%; }

        .dashboard {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            align-items: flex-start;
            margin: 30px auto;
            box-sizing: border-box;
            padding: 0 20px;
            flex: 1;
        }

        .visual-section {
            position: sticky;
            top: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #view-port {
            width: var(--field-size); height: var(--field-size);
            position: relative; border: 1px solid #444; border-radius: 8px;
            background: #000; overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }

        #field-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 96.5%; height: 96.5%;
            transform: translate(-50%, -50%);
            background-size: contain; background-repeat: no-repeat;
            z-index: 2;
        }

        .slider-wrapper { height: var(--field-size); display: flex; align-items: center; }
        input[type="range"] {
            appearance: slider-vertical; width: 20px; height: 100%;
            accent-color: var(--accent); cursor: pointer;
        }

        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 450px;
        }

        .glass-panel {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #globalWarning {
            background: rgba(255, 204, 0, 0.15); border: 1px solid var(--warning-gold);
            color: var(--warning-gold); padding: 12px; border-radius: 8px;
            margin-bottom: 15px; display: none; font-size: 0.85rem;
            text-align: center; font-weight: bold;
        }

        .field-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-field { 
            flex: 1; background: #222; border: 1px solid var(--border); 
            color: #888; padding: 12px; cursor: pointer; font-weight: 700; 
            border-radius: 6px; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn-field.active { border-color: var(--accent); color: var(--accent); background: rgba(180, 82, 255, 0.1); }

        textarea { 
            width: 100%; height: 120px; background: #050505; color: #888; 
            border: 1px solid #333; border-radius: 6px; padding: 12px;
            font-family: 'Fira Code', monospace; font-size: 11px; box-sizing: border-box;
            outline: none; margin-bottom: 10px; resize: vertical;
        }

        .btn-main {
            background: var(--accent); color: white; border: none; padding: 16px;
            border-radius: 6px; cursor: pointer; font-weight: 700; width: 100%;
            text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px;
        }

        #inspector {
            width: 100%; height: 300px; background: #080808; border: 1px solid #222;
            border-radius: 6px; overflow-y: auto; font-family: 'Fira Code', monospace;
            font-size: 11px; color: #888;
        }

        .log-line { display: flex; padding: 4px 10px; border-bottom: 1px solid #111; cursor: pointer; }
        .log-line.active-step { background: rgba(180, 82, 255, 0.3); color: white; border-left: 3px solid var(--accent); }
        .log-line.error-step { background: rgba(255, 204, 0, 0.1); color: var(--warning-gold); }
        .log-line.overheat-step { background: rgba(180, 82, 255, 0.1); color: var(--accent); font-weight: bold; }
        .line-num { width: 40px; color: #444; flex-shrink: 0; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #222; }
        input[type="number"] { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box;}
        label { font-size: 0.65rem; text-transform: uppercase; color: #555; display: block; margin-bottom: 5px; font-weight: 700; }

        #wall-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('../../assets/fields/Override_Walls_YogurtLib.png'); background-size: cover; background-repeat: no-repeat; background-position: center; pointer-events: none; z-index: 1; }
        #path-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #robot { position: absolute; border: 2px solid var(--accent); background: rgba(180, 82, 255, 0.3); transform-origin: center; z-index: 10; pointer-events: none; }
        #robot::after { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 50%; background: white; transform: translateX(-50%); }

        .telemetry-box { font-family: 'Fira Code', monospace; background: #000; padding: 10px; border-radius: 6px; border: 1px solid #222; }
    </style>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="../../index.html">Home</a>
    <a href="../custom-pather/index.html">Custom Pather</a>
    <a href="../data-visualizer/index.html" class="active">Data Visualizer</a>
    <a href="../../docs/index.html">Docs</a>
  </nav>
</header>
    
<div class="dashboard">
    <div class="visual-section">
        <div id="view-port">
            <div id="field-container"></div>
            <div id="wall-overlay"></div>
            <svg id="path-svg"><polyline id="path-line" fill="none" stroke="var(--accent)" stroke-width="3" /></svg>
            <div id="robot"></div>
        </div>
        <div class="slider-wrapper">
            <input type="range" id="timeSlider" min="0" max="0" value="0">
        </div>
    </div>

    <div class="control-section">
        <div class="glass-panel">
            <div id="globalWarning"></div>
            
            <div class="field-btns">
                <button class="btn-field active" id="btn-match" onclick="setField('match')">Match Field</button>
                <button class="btn-field" id="btn-skills" onclick="setField('skills')">Skills Field</button>
            </div>

            <div class="stats-grid" style="margin-bottom: 15px; margin-top: 0; padding-top: 0; border-top: none;">
                <div><label>Bot Width (in)</label><input type="number" id="botWid" value="12.5" onchange="updateRobotDims()"></div>
                <div><label>Bot Length (in)</label><input type="number" id="botLen" value="18" onchange="updateRobotDims()"></div>
            </div>

            <textarea id="dataInput" placeholder="Paste log here..."></textarea>
            <button class="btn-main" onclick="processData()">Analyze Data</button>
            
            <div id="inspector"></div>

            <div class="stats-grid">
                <div class="telemetry-box"><label>Position</label><span id="telemetry" style="font-size: 0.8rem; color: #aaa;">X: 0.0 Y: 0.0</span></div>
                <div class="telemetry-box" style="text-align: right;"><label>Heading</label><span id="headingVal" style="font-size: 0.9rem; color: var(--accent); font-weight: bold;">0.0°</span></div>
            </div>
        </div>
    </div>
</div>

<footer class="site-footer">
  <span>210E — yogurtlib.com</span>
  <span>Data Visualizer</span>
</footer>

<script>
    let pathData = [];
    const fPx = 550;
    const fIn = 144;
    let currentActiveLine = null;
    let cachedInspector = null;
    let cachedRobotElement = null;
    let cachedTelemetryElement = null;
    let cachedHeadingElement = null;
    const timeSlider = document.getElementById('timeSlider');
    let lastUpdateTime = 0;
    const UPDATE_THROTTLE = 16;

    timeSlider.addEventListener('input', function() {
        const now = Date.now();
        if (now - lastUpdateTime >= UPDATE_THROTTLE) {
            updateVisualization(parseInt(this.value));
            lastUpdateTime = now;
        }
    }, { passive: true });

    function norm(a) { return ((a % 360) + 360) % 360; }

    function setField(type) {
        const container = document.getElementById('field-container');
        if(type === 'match') {
            container.style.backgroundImage = "url('../../assets/fields/Override_H2H_No_Walls_YogurtLib.png')";
            document.getElementById('btn-match').classList.add('active');
            document.getElementById('btn-skills').classList.remove('active');
        } else {
            container.style.backgroundImage = "url('../../assets/fields/Override_Skills_No_Walls_YogurtLib.png')";
            document.getElementById('btn-skills').classList.add('active');
            document.getElementById('btn-match').classList.remove('active');
        }
    }

    function processData() {
        const raw = document.getElementById('dataInput').value;
        const lines = raw.split('\n');
        
        const regex = /\(X:\s*(-?\d+\.?\d*),\s*Y:\s*(-?\d+\.?\d*),\s*H:\s*(-?\d+\.?\d*),\s*MU1:\s*([a-zA-Z0-9\.\-]+),\s*MU2:\s*([a-zA-Z0-9\.\-]+)\)/;
        const tempRegex = /\(Drive Temp:\s*([\d\.]+)\s*Lever Temp:\s*([\d\.]+)\s*Intake Temp:\s*([\d\.]+)\)/i;
        
        pathData = [];
        currentActiveLine = null;
        const inspector = document.getElementById('inspector');
        inspector.innerHTML = "";
        
        let errorCount = 0;
        let isOverheating = false; 
        let runHasStarted = false; 

        const hasStartTrigger = /skills started|autonomous started|match auto started/i.test(raw);
        let parsingActive = !hasStartTrigger; 

        lines.forEach((lineText, index) => {
            if (!lineText.trim()) return;
            const lowerLine = lineText.toLowerCase();

            if (lowerLine.includes('skills started')) {
                setField('skills');
                parsingActive = true;
                runHasStarted = true;
                pathData = []; 
            } else if (lowerLine.includes('match auto started') || lowerLine.includes('autonomous started')) {
                setField('match');
                parsingActive = true;
                runHasStarted = true;
                pathData = []; 
            }
            
            const match = regex.exec(lineText);
            const tempMatch = tempRegex.exec(lineText);

            const lineDiv = document.createElement('div');
            lineDiv.className = 'log-line';
            lineDiv.innerHTML = `<span class="line-num">${index + 1}</span><span>${lineText}</span>`;
            
            if (tempMatch && !runHasStarted) {
                const tDrive = parseFloat(tempMatch[1]);
                const tLever = parseFloat(tempMatch[2]);
                const tIntake = parseFloat(tempMatch[3]);
                
                if (tDrive >= 40 || tLever >= 40 || tIntake >= 40) {
                    isOverheating = true;
                    lineDiv.classList.add('overheat-step');
                } else {
                    lineDiv.style.opacity = '0.5'; 
                }
            } else if (!parsingActive) {
                lineDiv.style.opacity = '0.2';
            }

            if (match && parsingActive) {
                const x = parseFloat(match[1]);
                const y = parseFloat(match[2]);

                if (hasStartTrigger && Math.abs(x) < 0.001 && Math.abs(y) < 0.001 && pathData.length === 0) {
                    lineDiv.style.opacity = '0.3';
                } else {
                    const entry = {
                        x: x, y: y, h: parseFloat(match[3]),
                        mu1: parseFloat(match[4]), mu2: parseFloat(match[5]),
                        id: pathData.length
                    };

                    let diff = Math.abs(norm(entry.mu1) - norm(entry.mu2));
                    if (diff > 180) diff = 360 - diff;
                    
                    if (isNaN(diff) || diff >= 10.0) {
                        errorCount++;
                        lineDiv.classList.add('error-step');
                    }
                    
                    const currentIdx = pathData.length;
                    lineDiv.onclick = () => {
                        timeSlider.value = currentIdx;
                        updateVisualization(currentIdx);
                    };
                    lineDiv.id = `line-row-${currentIdx}`;
                    pathData.push(entry);
                }
            }
            
            inspector.appendChild(lineDiv);
        });

        const warn = document.getElementById('globalWarning');
        warn.style.display = "none";
        warn.style.background = ""; 
        warn.style.borderColor = "";
        warn.style.color = "";
        
        let warningMessages = [];

        if (isOverheating) {
            warn.style.background = "rgba(180, 82, 255, 0.3)";
            warn.style.borderColor = "var(--accent)";
            warn.style.color = "var(--accent)";
            warningMessages.push("CRITICAL: MOTORS OVER 40°C DETECTED BEFORE START!");
        }

        if (errorCount > 0) {
            warningMessages.push(`IMU DRIFT: ${errorCount} anomalies detected.`);
        }

        if (warningMessages.length > 0) {
            warn.style.display = "block";
            warn.innerHTML = warningMessages.join("<br><br>");
        }

        if (pathData.length > 0) {
            drawPath();
            timeSlider.max = pathData.length - 1;
            timeSlider.value = 0;
            updateVisualization(0);
        }
    }

    function worldToPx(x, y) {
        return { x: ((x + 72) / fIn) * fPx, y: fPx - (((y + 72) / fIn) * fPx) };
    }

    function drawPath() {
        let pts = "";
        pathData.forEach(p => {
            const pos = worldToPx(p.x, p.y);
            pts += `${pos.x},${pos.y} `;
        });
        document.getElementById('path-line').setAttribute("points", pts.trim());
    }

    function updateVisualization(idx) {
        if (!pathData[idx]) return;
        
        requestAnimationFrame(() => {
            const d = pathData[idx];
            
            if (!cachedRobotElement) {
                cachedRobotElement = document.getElementById('robot');
                cachedTelemetryElement = document.getElementById('telemetry');
                cachedHeadingElement = document.getElementById('headingVal');
                cachedInspector = document.getElementById('inspector');
            }
            
            const pos = worldToPx(d.x, d.y);
            cachedRobotElement.style.left = `${pos.x}px`;
            cachedRobotElement.style.top = `${pos.y}px`;
            cachedRobotElement.style.transform = `translate(-50%, -50%) rotate(${90 - d.h}deg)`;
            
            cachedTelemetryElement.innerText = `X: ${d.x.toFixed(1)} Y: ${d.y.toFixed(1)}`;
            cachedHeadingElement.innerText = `${d.h.toFixed(1)}°`;

            if (currentActiveLine) {
                currentActiveLine.classList.remove('active-step');
            }

            const activeLine = document.getElementById(`line-row-${idx}`);
            if (activeLine && activeLine !== currentActiveLine) {
                activeLine.classList.add('active-step');
                currentActiveLine = activeLine;
                
                if (cachedInspector) {
                    const lineTop = activeLine.offsetTop;
                    const lineBottom = lineTop + activeLine.offsetHeight;
                    const viewTop = cachedInspector.scrollTop;
                    const viewBottom = viewTop + cachedInspector.offsetHeight;

                    if (lineTop < viewTop || lineBottom > viewBottom) {
                        cachedInspector.scrollTop = lineTop - (cachedInspector.offsetHeight / 2) + (activeLine.offsetHeight / 2);
                    }
                }
            }
        });
    }

    function updateRobotDims() {
        const l = document.getElementById('botLen').value;
        const w = document.getElementById('botWid').value;
        const bot = document.getElementById('robot');
        bot.style.height = `${(l / fIn) * fPx}px`;
        bot.style.width = `${(w / fIn) * fPx}px`;
    }

    setField('match');
    updateRobotDims();
</script>

</body>
</html>
